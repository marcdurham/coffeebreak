# Serves the built Yew app and proxies API calls to the backend container.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/wasm application/javascript text/css application/json;

    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The shell, service worker and manifest must always be revalidated, or a
    # stale index.html keeps pointing at hashed files a newer deploy removed.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # Trunk's hashed build output never changes under the same name. A
    # missing one is a real 404 -- falling back to index.html would hand the
    # browser HTML where it expects wasm/JS/CSS.
    location ~* \.(wasm|js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(png|svg|ico)$ {
        try_files $uri =404;
    }

    # yew-router SPA: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
